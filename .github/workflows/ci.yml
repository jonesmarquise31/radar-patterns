name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check every module
        run: |
          for file in patterns/*/*.js; do
            node --check "$file"
          done

      - name: Unit tests
        run: node --test

      - name: Verify zero runtime dependencies
        run: |
          node - <<'JS'
          const pkg = require("./package.json");
          const deps = Object.keys(pkg.dependencies || {});
          if (deps.length) {
            console.error("unexpected dependencies:", deps.join(", "));
            process.exit(1);
          }
          console.log("no runtime dependencies, as documented");
          JS
